<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <title>About – Nekudot Design</title>
    <meta name="description" content="Nekudot Design is the studio behind StudioMemory — a private visual archive app for artists, creators, and makers.">
    <meta property="og:title" content="About – Nekudot Design">
    <meta property="og:description" content="Nekudot Design is the studio behind StudioMemory — a private visual archive app for artists, creators, and makers.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nekudotdesign.com/about.html">
    <link rel="canonical" href="https://nekudotdesign.com/about.html">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Nekudot Design",
      "url": "https://nekudotdesign.com",
      "logo": "https://nekudotdesign.com/logo.svg"
    }
    </script>

    <style>
        body, html {
            height: 100%;
            margin: 0;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }

        /* Logo */
        #interactiveLogo {
            width: 15%;
            height: auto;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
            cursor: grab;
            transition: transform 0.3s ease;
            display: block;
            margin: 60px auto 48px auto;
            animation: logoIntro 1s cubic-bezier(0.47, 1.8, 0.41, 0.8) 0.2s backwards;;
        }

        @keyframes logoIntro {
            0%   { transform: scale(0.6); opacity: 0; }
            60%  { opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            #interactiveLogo { animation: none; }
        }

        @media (max-width: 1024px) {
            #interactiveLogo {
                width: 30%;
            }
        }

        /* Content */
        .content {
            max-width: 560px;
            margin: 0 auto;
            padding: 0 32px 120px 32px;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.3px;
            margin: 0 0 8px 0;
            color: #000000;
        }

        h2 {
            font-size: 17px;
            font-weight: 600;
            margin: 32px 0 8px 0;
            color: #000000;
        }

        .smp-heading-link {
            color: #000000;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .smp-heading-link:hover {
            color: #FB4342;
        }

        .smp-section {
            display: block;
            text-decoration: none;
            cursor: pointer;
        }

        .smp-section:hover .smp-heading-link,
        .smp-section:hover p {
            color: #FB4342 !important;
            transition: color 0.2s ease;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: #444444;
            margin: 0 0 12px 0;
        }

        .divider {
            border: none;
            border-top: 1px solid #e0e0e0;
            margin: 32px 0;
        }

        .legal {
            font-size: 12px;
            color: #86868b;
            line-height: 1.6;
            margin: 0;
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .footer-link {
            color: #000000;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }

        .footer-link svg {
            width: 28px;
            height: 28px;
            fill: transparent;
            transition: fill 0.2s ease, color 0.2s ease, transform 0.2s ease, filter 0.2s ease;
        }

        .footer-link:hover {
            color: #FB4342;
        }

        .footer-link:hover svg {
            fill: #FB4342;
            transform: translateY(-3px);
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .footer-link:active svg {
            transform: translateY(0) scale(0.9);
            filter: none;
            transition: transform 0.1s ease;
        }

        /* SMP image icon */
        .smp-link {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background-color: #000000;
            overflow: hidden;
            display: block;
            transition: transform 0.2s ease;
        }

        .smp-link img {
            width: 100%;
            height: 100%;
            display: block;
            transition: filter 0.2s ease;
        }

        .smp-link:hover img {
             filter: brightness(0) saturate(100%) invert(37%) sepia(99%) saturate(1000%) hue-rotate(335deg) brightness(115%);

        }

        .smp-link:hover {
            transform: translateY(-3px);
        }

        .smp-link:active {
            transform: translateY(0) scale(0.9);
            transition: transform 0.1s ease;
        }
    </style>
</head>
<body>

    <img src="logo.svg" alt="Nekudot Design Logo" id="interactiveLogo">

    <div class="content">
        <h1>Nekudot Design Limited</h1>
        <p>We build software.</p>

        <hr class="divider">

        <a href="https://studiomemoryapp.com" target="_blank" rel="noopener noreferrer" class="smp-section">
        <h2 class="smp-heading-link">StudioMemory</h2>
        <p>A private visual archive app for artists, creators, and makers.</p>
        </a>

        <hr class="divider">

    </div><!-- end .content -->

    <!-- Footer -->
    <div class="footer">

        <!-- Home -->
        <a href="index.html" class="footer-link" title="Home">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </a>

        <!-- SMP product icon -->
        <a href="https://studiomemoryapp.com" target="_blank" rel="noopener noreferrer" class="smp-link" title="StudioMemory">
            <img src="SMPLogo.png" alt="StudioMemory">
        </a>

        <!-- Email -->
        <a href="mailto:info@nekudotdesign.com" class="footer-link" title="Contact Us">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
        </a>

    </div><!-- end .footer -->

    <script>
        const logo = document.getElementById('interactiveLogo');
        let isDragging = false;
        let startX, startY;

        logo.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            logo.style.transition = 'transform 0.1s ease';
            logo.style.transform = 'scale(0.95)';
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const deltaX = e.touches[0].clientX - startX;
            const deltaY = e.touches[0].clientY - startY;
            logo.style.transition = 'none';
            logo.style.transform = `scale(1.05) translate(${deltaX}px, ${deltaY}px)`;
            if (e.cancelable) e.preventDefault();
        }, { passive: false });

        window.addEventListener('touchend', () => {
            if (!isDragging) return;
            isDragging = false;
            logo.style.transition = 'transform 0.7s cubic-bezier(0.47, 1.8, 0.41, 0.8)';
            logo.style.transform = 'scale(1) translate(0px, 0px)';
        });

        logo.addEventListener('mousedown', (e) => {
    		isDragging = true;
		 startX = e.clientX;
		 startY = e.clientY;
		 logo.style.cursor = 'grabbing';
		 logo.style.transition = 'transform 0.1s ease';
		 logo.style.transform = 'scale(0.95)';
	});

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;
            logo.style.transition = 'none';
            logo.style.transform = `scale(1.05) translate(${deltaX}px, ${deltaY}px)`;
        });

        window.addEventListener('mouseup', () => {
   		if (!isDragging) return;
    		isDragging = false;
    		logo.style.cursor = 'grab';
    		logo.style.transition = 'transform 0.7s cubic-bezier(0.47, 1.8, 0.41, 0.8)';
   		 logo.style.transform = 'scale(1) translate(0px, 0px)';
	});
    </script>

</body>
</html>
