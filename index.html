<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nekudot Design</title>
    <style>
        /* Minimalist layout centered on screen */
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center; 
            align-items: center;     
            background-color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; 
        }

        /* Logo scaled to exactly 40% as requested */
        img {
            width: 30%;       
            height: auto;
            display: block;
        }

        /* Discrete Bottom Center Footer */
        .footer-link {
            position: absolute;
            bottom: 40px;   
            left: 50%;
            transform: translateX(-50%); 
            color: #86868b; 
            transition: color 0.2s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .footer-link:hover {
            color: #1d1d1f; 
        }

        svg {
            width: 22px; 
            height: 22px;
        }
    </style>
</head>
<body>

    <img src="logo.png" alt="Nekudot Design Logo">

    <a href="mailto:nekudotdesignlimited@gmail.com" class="footer-link" title="Contact Us">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
    </a>

</body>
</html>
