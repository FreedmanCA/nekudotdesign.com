<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nekudot Design</title>
    <style>
        /* 1. Page Layout & Entrance Animation */
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center; 
            align-items: center;     
            background-color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; 
            /* Trigger the graceful fade-in on load */
            animation: gracefulFadeIn 1.2s ease-out;
        }

        @keyframes gracefulFadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* 2. Logo Styling */
        img {
            width: 30%;       
            height: auto;
            display: block;
	    touch-action: none;
            
            /* Enhanced Unselectable Properties */
            user-select: none;           /* Standard */
            -webkit-user-select: none;    /* Safari/Chrome */
            -ms-user-select: none;       /* Internet Explorer/Edge */
            
            /* Prevents the ghost image during drag */
            -webkit-user-drag: none;
            pointer-events: auto;        /* Ensures your JS events still work */
            
            cursor: grab;
            /* Initial transition for the fade-in and first hover */
            transition: transform 0.3s ease;
        }
	/* Responsive adjustment for iPhone and iPad (Portrait) */
        @media (max-width: 1024px) {
            img {
                width: 55%; /* Balanced size for both iPhone and iPad Portrait */
            }
        }


        /* 3. Footer Link & Mail Icon Interactivity */
        .footer-link {
            position: absolute;
            bottom: 40px;   
            left: 50%;
            transform: translateX(-50%); 
            color: #86868b; 
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }

        /* Base SVG styling */
        svg {
            width: 22px; 
            height: 22px;
            fill: transparent;
            /* Handles color, fill, lift, and shadow transitions */
            transition: fill 0.2s ease, color 0.2s ease, transform 0.2s ease, filter 0.2s ease;
        }

        /* Hover: Color change, Red fill, and Lift with Shadow */
        .footer-link:hover {
            color: #000000; 
        }

        .footer-link:hover svg {
            fill: #FB4342; 
            transform: translateY(-3px);
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        /* Click: Snap down and shrink */
        .footer-link:active svg {
            transform: translateY(0) scale(0.9);
            filter: none;
            transition: transform 0.1s ease;
        }
    </style>
</head>
<body>

    <img src="logo.svg" alt="Nekudot Design Logo" id="interactiveLogo">

    <a href="mailto:nekudotdesignlimited@gmail.com" class="footer-link" title="Contact Us">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
    </a>

    <script>
        const logo = document.getElementById('interactiveLogo');
        let isDragging = false;
        let startX, startY;

        // 1. Handle Hover (Scale Up)
        logo.addEventListener('mouseenter', () => {
            if (!isDragging) {
                logo.style.transition = 'transform 0.3s ease';
                logo.style.transform = 'scale(1.03)';
            }
        });

        // 2. Handle Mouse Leave (Return to Normal)
        logo.addEventListener('mouseleave', () => {
            if (!isDragging) {
                logo.style.transition = 'transform 0.3s ease';
                logo.style.transform = 'scale(1)';
            }
        });


	// Handle Mobile Touch Start (Tactile Press & Start Drag)
        logo.addEventListener('touchstart', (e) => {
            isDragging = true;
            // e.touches ensures we track the primary finger contact
            startX = e.touches.clientX;
            startY = e.touches.clientY;
            
            logo.style.transition = 'transform 0.1s ease';
            logo.style.transform = 'scale(0.95)';
        }, { passive: true });


        // 3. Handle Mouse Down (Tactile Press & Start Drag)
        logo.addEventListener('mousedown', (e) => {
            isDragging = true;
            e.preventDefault();
            startX = e.clientX;
            startY = e.clientY;
            
            logo.style.cursor = 'grabbing';
            // Quick press feedback
            logo.style.transition = 'transform 0.1s ease';
            logo.style.transform = 'scale(0.95)';
        });


	// Handle Mobile Touch Movement
        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            
            const deltaX = e.touches.clientX - startX;
            const deltaY = e.touches.clientY - startY;
            
            logo.style.transition = 'none';
            logo.style.transform = `scale(1.05) translate(${deltaX}px, ${deltaY}px)`;
            
            // Prevents iOS from scrolling the web page while dragging the logo
            if (e.cancelable) e.preventDefault();
        }, { passive: false });


        // 4. Handle Movement
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;
            
            // Disable transitions for instant drag response
            logo.style.transition = 'none';
            // Maintain a slightly larger "carrying" scale while moving
            logo.style.transform = `scale(1.05) translate(${deltaX}px, ${deltaY}px)`;
        });


	// Handle Mobile Touch Release (Snap Back)
        window.addEventListener('touchend', () => {
            if (!isDragging) return;
            isDragging = false;
            
            logo.style.transition = 'transform 0.7s cubic-bezier(0.47, 1.8, 0.41, 0.8)';
            logo.style.transform = 'scale(1) translate(0px, 0px)';
        });


        // 5. Handle Release (Snap Back)
        window.addEventListener('mouseup', () => {
            if (!isDragging) return;
            isDragging = false;
            
            logo.style.cursor = 'grab';
            // Bouncy snap back to center using Apple-style cubic-bezier
            logo.style.transition = 'transform 0.7s cubic-bezier(0.47, 1.8, 0.41, 0.8)';
            logo.style.transform = 'scale(1) translate(0px, 0px)';
        });
    </script>

</body>
</html>
