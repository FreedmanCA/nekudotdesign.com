<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nekudot Design</title>
    <style>
        /* 1. Page Layout & Entrance Animation */
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center; 
            align-items: center;     
            background-color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; 
            animation: gracefulFadeIn 1.2s ease-out;
        }

        @keyframes gracefulFadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* 2. Logo Styling */
        img {
            width: 30%;       
            height: auto;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
            cursor: grab;
            transition: transform 0.3s ease;
            
            /* CRITICAL FOR iOS: Prevents page scrolling while dragging logo */
            touch-action: none;
            -webkit-touch-callout: none;
        }

        /* 3. Footer Link & Mail Icon Interactivity */
        .footer-link {
            position: absolute;
            bottom: 40px;   
            left: 50%;
            transform: translateX(-50%); 
            color: #86868b; 
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }

        svg {
            width: 22px; 
            height: 22px;
            fill: transparent;
            transition: fill 0.2s ease, color 0.2s ease, transform 0.2s ease, filter 0.2s ease;
        }

        .footer-link:hover {
            color: #000000; 
        }

        .footer-link:hover svg {
            fill: #FB4342; 
            transform: translateY(-3px);
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .footer-link:active svg {
            transform: translateY(0) scale(0.9);
            filter: none;
            transition: transform 0.1s ease;
        }
    </style>
</head>
<body>

    <img src="logo.png" alt="Nekudot Design Logo" id="interactiveLogo">

    <a href="mailto:nekudotdesignlimited@gmail.com" class="footer-link" title="Contact Us">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
    </a>

    <script>
        const logo = document.getElementById('interactiveLogo');
        let isDragging = false;
        let startX, startY;

        // Helper to get X/Y from either Mouse or Touch
        const getPointerCoords = (e) => {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches.clientX, y: e.touches.clientY };
            }
            return { x: e.clientX, y: e.clientY };
        };

        // Start Drag (MouseDown & TouchStart)
        const onStart = (e) => {
            isDragging = true;
            const coords = getPointerCoords(e);
            startX = coords.x;
            startY = coords.y;
            
            logo.style.cursor = 'grabbing';
            logo.style.transition = 'transform 0.1s ease';
            logo.style.transform = 'scale(0.95)';
            
            // Prevent scrolling on touch devices
            if (e.type === 'touchstart') {
                // e.preventDefault(); 
            }
        };

        // Move (MouseMove & TouchMove)
        const onMove = (e) => {
            if (!isDragging) return;
            
            const coords = getPointerCoords(e);
            const deltaX = coords.x - startX;
            const deltaY = coords.y - startY;
            
            logo.style.transition = 'none';
            logo.style.transform = `scale(1.05) translate(${deltaX}px, ${deltaY}px)`;
        };

        // End Drag (MouseUp & TouchEnd)
        const onEnd = () => {
            if (!isDragging) return;
            isDragging = false;
            
            logo.style.cursor = 'grab';
            // Springy bounce using your preferred cubic-bezier
            logo.style.transition = 'transform 0.7s cubic-bezier(0.47, 1.8, 0.41, 0.8)';
            logo.style.transform = 'scale(1) translate(0px, 0px)';
        };

        // Mouse Events (Desktop)
        logo.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);

        // Touch Events (iOS/Android)
        logo.addEventListener('touchstart', onStart, { passive: false });
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onEnd);

        // Hover Effect (Desktop Only)
        logo.addEventListener('mouseenter', () => {
            if (!isDragging) {
                logo.style.transition = 'transform 0.3s ease';
                logo.style.transform = 'scale(1.03)';
            }
        });
        logo.addEventListener('mouseleave', () => {
            if (!isDragging) {
                logo.style.transition = 'transform 0.3s ease';
                logo.style.transform = 'scale(1)';
            }
        });
    </script>

</body>
</html>
