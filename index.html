<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nekudot Design</title>
    <style>
        /* Minimalist layout centered on screen */
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center; 
            align-items: center;     
            background-color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; 
            animation: gracefulFadeIn 1.2s ease-out;
        }

        /* Defines the graceful fade-in animation */
        @keyframes gracefulFadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* Logo scaled to exactly 30% with a smooth transition */
        img {
            width: 30%;       
            height: auto;
            display: block;
            transition: transform 0.3s ease;
        }

        /* The Gentle Lift hover effect */
        img:hover {
            transform: scale(1.03); 
        }

        /* Discrete Bottom Center Footer */
        .footer-link {
            position: absolute;
            bottom: 40px;   
            left: 50%;
            transform: translateX(-50%); 
            color: #86868b; 
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Hover state for the link outline */
        .footer-link:hover {
            color: #000000; 
        }

        /* Hover state specifically for the SVG fill */
        .footer-link:hover svg {
            fill: #FB4342; 
        }

        /* Base SVG styling and transitions */
        svg {
            width: 22px; 
            height: 22px;
            fill: transparent;
            transition: fill 0.2s ease, color 0.2s ease;
        }
    </style>
</head>
<body>

    <img src="logo.png" alt="Nekudot Design Logo">

    <a href="mailto:nekudotdesignlimited@gmail.com" class="footer-link" title="Contact Us">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
    </a>

</body>
</html>
